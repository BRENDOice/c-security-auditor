name: DevSecOps SAST Security Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  audit-linux:
    name: SAST Audit & Build (Linux GCC C11)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile C Auditor
        run: |
          make clean
          make

      - name: Run Audit on Vulnerable Sample (Security Gate Test)
        run: |
          ./c-security-auditor tests/vulnerable_sample.c -o build/report_vulnerable.md -f markdown || echo "Vulnerabilidades detetadas com sucesso pelo SAST!"

      - name: Run Audit on Clean Sample (Verification)
        run: |
          ./c-security-auditor tests/clean_sample.c -o build/report_clean.md -f markdown

  audit-windows:
    name: SAST Audit & Build (Windows PowerShell MinGW)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Build & Audit Script
        shell: powershell
        run: |
          .\build.ps1 -Clean
        continue-on-error: true